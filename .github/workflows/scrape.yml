name: Scrape Columbus City Bulletins
run-name: "${{ github.actor }} is scraping City Bulletins on ${{ github.event_name }}"
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 6 a.m.; bulletins normally post on Sunday or Saturday.
      timezone: "America/New_York"

concurrency:
  group: scrape-rss
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, dom, simplexml
          coverage: none
      - name: Run scraper
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          php main.php
      - name: "Store scraped content for debugging (on failure)"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scrape-debug-${{ github.run_id }}
          path: |
            ./scraper-output.html
            ./scraper-debug.log
          retention-days: 30
      - name: Validate feed XML
        run: php -r '$xml = simplexml_load_file("feed.xml"); if ($xml === false) { fwrite(STDERR, "Invalid feed.xml\n"); exit(1);} echo "feed.xml is valid XML\n";'
        if: hashFiles('feed.xml') != ''
      - name: Commit and push changes
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/links.csv feed.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            timestamp=$(date -u)
            git commit -m "chore: update links and feed ${timestamp}" || exit
            git push
          fi
